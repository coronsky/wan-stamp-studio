<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ワンコGIFプロンプトメーカー（24パターン）</title>
<style>
body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;background:#f6f3ee;color:#333;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:20px;margin:8px 0}h2{font-size:16px;margin:0 0 8px}
section{background:#fff;border-radius:12px;padding:12px;margin:12px 0;box-shadow:0 1px 3px #0002}
label{display:block;margin:8px 0}select,input,textarea,button{font:inherit;box-sizing:border-box}
select,input[type=number],textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}
textarea{font-size:13px}
button{padding:10px 14px;border:0;border-radius:10px;background:#e0873a;color:#fff;margin:4px 4px 4px 0}
button.sub{background:#8a7f73}
small{display:block;color:#777;margin:4px 0}
#chips button{padding:6px 0;width:calc(25% - 4px);margin:2px 2px;background:#eadfd2;color:#333;font-size:13px}
#chips button.on{background:#e0873a;color:#fff}
#status{color:#2a7;min-height:1.4em}
</style>
<main>
<h1>🐶 ワンコGIFプロンプトメーカー</h1>
<small>添付のような「位置がずれない」くるくる・ふりふりGIFを、ChatGPTで24パターン作るための依頼文を1パターンずつ作ります。①コマ画像シートを作る → ②GIFにする、の2段階です。API・キーは使いません。</small>

<section><h2>1. 共通設定</h2>
<label>犬の特徴（参考写真も添付してください）<textarea id="dog" rows="3">添付した参考写真の犬をモデルにし、顔・毛色・毛並み・耳・体型の特徴を全コマで同じに保つ。</textarea></label>
<label>タッチ<select id="touch"><option>写真のようにリアル（添付GIFのような質感）</option><option>かわいいイラスト</option><option>水彩イラスト</option><option>ぬいぐるみ風の3D</option></select></label>
<label>背景色（犬が白いときは白以外がおすすめ）<select id="bg"><option value="#BFE3FF">水色 #BFE3FF</option><option value="#C8F0DC">ミント #C8F0DC</option><option value="#FFD6E5">ピンク #FFD6E5</option><option value="#E6E6E6">薄グレー #E6E6E6</option><option value="#FFFFFF">白 #FFFFFF</option></select></label>
<label>コマ数<select id="frames"><option value="6">6コマ（3×2）</option><option value="8">8コマ（4×2）</option><option value="12" selected>12コマ（4×3）</option></select></label>
<label>再生時間（秒）<select id="sec"><option>1</option><option>2</option><option selected>3</option><option>4</option></select></label>
<label>ループ回数（再生時間×ループ ≦ 4秒）<select id="loops"></select></label>
<label>GIFのサイズ<select id="size"><option value="320,270">320×270（スタンプ）</option><option value="240,240">240×240（メイン画像）</option><option value="180,180">180×180（絵文字）</option><option value="362,362">362×362</option></select></label>
<label><input id="align" type="checkbox" checked> ずれ補正する（足元と中心を全コマで自動でそろえる）</label>
</section>

<section><h2>2. パターンを選ぶ（24個）</h2><div id="chips"></div>
<label id="nm"></label><label>動きの内容（自由に書き換えられます）<textarea id="desc" rows="3"></textarea></label>
<button id="prev" class="sub">◀ 前へ</button><button id="next" class="sub">次へ ▶</button></section>

<section><h2>3. ① コマ画像シートを作る</h2><small>参考写真を添付して、下の文章をChatGPTに貼ります。</small>
<textarea id="p1" rows="14" readonly></textarea><button id="c1">① をコピー</button></section>

<section><h2>4. ② GIFにする</h2><small>①でできたシート画像を保存し、同じチャットに添付し直してから、下の文章を貼ります。コードは書き換えず、そのまま実行させます。</small>
<textarea id="p2" rows="14" readonly></textarea><button id="c2">② をコピー</button><p id="status" role="status"></p></section>
</main>
<script>
const $=id=>document.getElementById(id);
const PATTERNS=[
['くるっと回る','正面から右向き→後ろ向き→左向き→正面へ、その場で1回転する。足の位置は動かさない','正面を向いて立つ'],
['手を振る','正面で右の前足を上げ、左右に3回振って下ろす。笑顔','正面を向いて立つ'],
['おじぎ','正面で上体を前に倒して丁寧におじぎし、ゆっくり戻る','正面を向いて立つ'],
['うなずく（OK）','笑顔で頭を上下に2回うなずく。体と足は動かさない','正面を向いて立つ'],
['首をかしげる','頭を右→左へ交互にかしげる。目は大きく、不思議そうな表情','正面を向いて立つ'],
['ジャンプ','少しかがんでから真上にジャンプし、同じ位置に着地する','正面を向いて立つ'],
['バンザイ','両前足を上に伸ばしてバンザイし、下ろす。口を開けて笑顔','正面を向いて立つ'],
['拍手','前足を胸の前で合わせてぱちぱちと3回拍手する。笑顔','正面を向いて立つ'],
['ダンス','体を左右にゆらしてリズムに乗る。足の位置は固定','正面を向いて立つ'],
['ハート','前足で頭の上にハートの形を作り、ぱっと広げる','正面を向いて立つ'],
['ウインク','片目をぱちっとつむり、舌をぺろっと出す','正面を向いて立つ'],
['投げキッス','前足を口元にあて、投げキッスで前足をふわっと前に出す','正面を向いて立つ'],
['うとうと','まぶたが重くなり、頭がこくりこくりと下がって目を閉じる','正面を向いて立つ'],
['びっくり','目を丸く見開き、小さく跳ねて毛が少し逆立つ','正面を向いて立つ'],
['ごめんね','前足をそろえて頭を下げ、上目づかいで申し訳なさそうにする','正面を向いて立つ'],
['ありがとう','前足を胸に当て、笑顔で小さくおじぎして顔を上げる','正面を向いて立つ'],
['大好き','目がハートになり、体をゆらゆら揺らす','正面を向いて立つ'],
['しっぽフリフリ','後ろ向きで、おしりとしっぽを左右に大きく振る','後ろ向きに立つ'],
['おねだり','前足をすり合わせ、うるうるの目で上目づかいにお願いする','正面を向いて立つ'],
['ぷんぷん','ほっぺをふくらませ、前足を下げて足踏みするように体を揺らす','正面を向いて立つ'],
['わーい','口を大きく開けて笑い、小さくぴょんぴょん跳ねる','正面を向いて立つ'],
['ドヤ顔','胸を張って顔を少し上げ、目がキラッと光る','正面を向いて立つ'],
['うるうる泣く','目から涙がこぼれ、前足で目をぬぐう','正面を向いて立つ'],
['バイバイ','大きく前足を振りながらウインクして笑顔で手を振る','正面を向いて立つ']];
const descs=PATTERNS.map(p=>p[1]);let idx=0;
const st=s=>$('status').textContent=s;
function layout(){let n=+$('frames').value;return n===6?[3,2]:n===8?[4,2]:[4,3]}
function syncLoops(){let S=+$('sec').value,cur=+$('loops').value||1,n=Math.floor(4/S);$('loops').replaceChildren();for(let i=1;i<=n;i++){let o=document.createElement('option');o.value=i;o.textContent=i;$('loops').append(o)}$('loops').value=String(Math.min(cur,n))}
function hex(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function p1(){let [c,r]=layout(),n=c*r,pt=PATTERNS[idx],bg=$('bg').value;
return ['LINEアニメスタンプ用の「連続コマ画像シート」を1枚作ってください。（動きは後でGIFにします）','','■ 犬',$('dog').value.trim(),'■ タッチ',$('touch').value,'','■ 動き：'+pt[0],descs[idx],'・1コマ目は「'+pt[2]+'」基準ポーズ。最終コマの次に1コマ目へ自然につながる（ループする）','・上の動きを'+n+'コマに均等に割り当てる','','■ シートの形式（厳守）','・'+c+'列×'+r+'行の格子、全'+n+'コマ、各コマは同じ大きさの正方形','・並び順は左上→右へ→次の段（1コマ目が左上）','・コマの間に枠線・隙間・番号・文字を入れない','','■ ずれ防止（最重要）','・カメラ固定。全コマで犬の大きさ（縮尺）を同じにする','・全コマで足元の位置（接地位置）と体の中心を同じ位置に置く。コマごとに犬が上下左右へずれない','・犬はコマの中央に収め、手足・耳・毛が見切れない余白を各コマに確保する','・背景は全コマ同じ単色 '+bg+' のみ（グラデーション・影・床・模様・光のにじみなし）','・犬の色や毛量・顔・体型は全コマで同じ（描き分けない）','・犬の毛先と背景を混ぜない（輪郭をはっきりさせる）'].join('\n')}
function p2(){let [c,r]=layout(),n=c*r,[W,H]=$('size').value.split(',').map(Number),S=+$('sec').value,L=+$('loops').value||1,pt=PATTERNS[idx],bg=hex($('bg').value),fn='dog-'+String(idx+1).padStart(2,'0');
let code=['from PIL import Image, ImageFilter','import glob, os','import numpy as np','try:','    from scipy import ndimage','except Exception:','    ndimage = None','','COLS, ROWS = '+c+', '+r,'BG = ('+bg.join(', ')+')   # 背景色','TOL = 60                # 背景とみなす色の差','OUT_W, OUT_H = '+W+', '+H,'DELAY = '+Math.round(1000*S/n)+'          # 1コマのミリ秒','LOOPS = '+L,'ALIGN = '+($('align').checked?'True':'False'),'','files = glob.glob("/mnt/data/*.png") + glob.glob("/mnt/data/*.jpg") + glob.glob("/mnt/data/*.jpeg") + glob.glob("/mnt/data/*.webp")','sheet = Image.open(sorted(files, key=os.path.getmtime)[-1]).convert("RGB")','cw, ch = sheet.width // COLS, sheet.height // ROWS','','def cutout(cell):','    a = np.asarray(cell).astype(int)','    d = np.abs(a - np.array(BG)).sum(axis=2)','    bgm = d <= TOL','    if ndimage is not None:','        lab, _ = ndimage.label(bgm)','        edge = set(lab[0, :]) | set(lab[-1, :]) | set(lab[:, 0]) | set(lab[:, -1])','        cnt = np.bincount(lab.ravel())',
'        edge |= set(np.nonzero(cnt > lab.size * 0.08)[0])   # 端に届かない大きな背景も含める',
'        edge.discard(0)','        bgm = np.isin(lab, list(edge))','    alpha = Image.fromarray(np.where(bgm, 0, 255).astype("uint8"))','    alpha = alpha.filter(ImageFilter.MinFilter(3))   # 縁の色残りを1px削る','    im = cell.convert("RGBA"); im.putalpha(alpha)','    return im','','cells = []','for k in range('+n+'):','    x, y = (k % COLS) * cw, (k // COLS) * ch','    cells.append(cutout(sheet.crop((x, y, x + cw, y + ch))))','','boxes = [c.getchannel("A").point(lambda v: 255 if v > 127 else 0).getbbox() for c in cells]','if ALIGN:','    bots = sorted(b[3] for b in boxes if b); cxs = sorted((b[0] + b[2]) / 2 for b in boxes if b)','    tb, tx = bots[len(bots)//2], cxs[len(cxs)//2]','    for i, b in enumerate(boxes):','        if not b: continue','        dx, dy = round(tx - (b[0] + b[2]) / 2), round(tb - b[3])','        moved = Image.new("RGBA", cells[i].size, (0, 0, 0, 0)); moved.paste(cells[i], (dx, dy)); cells[i] = moved','','# 全コマ共通の切り出し枠（コマごとにズレない）','bb = [c.getchannel("A").point(lambda v: 255 if v > 127 else 0).getbbox() for c in cells]','bb = [b for b in bb if b]','L0, T0 = max(0, min(b[0] for b in bb) - 4), max(0, min(b[1] for b in bb) - 4)','R0, B0 = min(cw, max(b[2] for b in bb) + 4), min(ch, max(b[3] for b in bb) + 4)','s = min(OUT_W / (R0 - L0), OUT_H / (B0 - T0))','nw, nh = max(1, round((R0 - L0) * s)), max(1, round((B0 - T0) * s))','ox, oy = (OUT_W - nw) // 2, (OUT_H - nh) // 2','','def to_p(im):','    mask = im.getchannel("A").point(lambda v: 255 if v < 128 else 0)','    p = im.convert("RGB").quantize(colors=255, dither=Image.Dither.NONE)','    p.paste(255, mask=mask)','    return p','','frames = []','for c in cells:','    f = c.crop((L0, T0, R0, B0)).resize((nw, nh), Image.LANCZOS)','    canvas = Image.new("RGBA", (OUT_W, OUT_H), (0, 0, 0, 0)); canvas.paste(f, (ox, oy))','    frames.append(to_p(canvas))','','kw = dict(save_all=True, append_images=frames[1:], duration=DELAY, disposal=2, transparency=255, optimize=False)','if LOOPS > 1:','    kw["loop"] = LOOPS - 1','out = "/mnt/data/'+fn+'.gif"','frames[0].save(out, **kw)','g = Image.open(out)','durs = []','for i in range(g.n_frames):','    g.seek(i); durs.append(g.info.get("duration", 0))','print(g.size, g.n_frames, "frames", sum(durs) / 1000, "sec", round(os.path.getsize(out) / 1024), "KB")'].join('\n');
return ['添付した画像は、犬の動き「'+pt[0]+'」の連続コマシート（'+c+'列×'+r+'行・'+n+'コマ・左上から順）です。これを、位置がずれない動くGIFにしてください。','','【重要】画像生成AIで描き直さないでください。下のPythonコードを、そのまま実行してください（書き換えない）。コードは、背景色を透過にし、全コマの足元と中心をそろえ、同じ枠で切り出してGIFにします。','','仕様：'+W+'×'+H+'px・'+n+'コマ・'+S+'秒・ループ'+L+'回・透過背景・'+fn+'.gif','','```python',code,'```','','実行後にお願いすること：','・最後のprintの結果（サイズ・コマ数・秒数・KB）を一行で報告する','・'+fn+'.gif をダウンロードリンクで渡す','・犬の周りに背景色が残る場合のみ、コードの TOL を 60 から 90 に上げて再実行する','・1MBを超える場合のみ、colors=255 を colors=128 に下げて再実行する'].join('\n')}
function refresh(){$('nm').textContent='パターン '+(idx+1)+' / 24：'+PATTERNS[idx][0];$('desc').value=descs[idx];$('p1').value=p1();$('p2').value=p2();[...$('chips').children].forEach((b,i)=>b.classList.toggle('on',i===idx))}
PATTERNS.forEach((p,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' '+p[0].slice(0,4);b.onclick=()=>{idx=i;refresh()};$('chips').append(b)});
$('desc').oninput=()=>{descs[idx]=$('desc').value;$('p1').value=p1();$('p2').value=p2()};
$('prev').onclick=()=>{idx=(idx+23)%24;refresh()};$('next').onclick=()=>{idx=(idx+1)%24;refresh()};
async function cp(id){let ta=$(id);try{await navigator.clipboard.writeText(ta.value);st('コピーしました')}catch{ta.select();st('選択した文章を手動でコピーしてください')}}
$('c1').onclick=()=>cp('p1');$('c2').onclick=()=>cp('p2');
['dog','touch','bg','frames','size','align','loops'].forEach(id=>$(id).addEventListener('change',refresh));$('dog').addEventListener('input',refresh);
$('sec').onchange=()=>{syncLoops();refresh()};
syncLoops();refresh();
</script></html>
